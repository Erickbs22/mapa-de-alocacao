services:
  - type: web
    name: mapa-de-alocacao
    env: node
    plan: free
    region: ohio
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 3001
      - key: AUTH_SECRET
        generateValue: true

