    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema web para planejamento e visualização da dedicação de programadores em projetos via linha do tempo e calendário." />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('app-theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
